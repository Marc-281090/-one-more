<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101425"><title>ONE MORE — Arcade Lab</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101425;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}button{font:inherit;cursor:pointer;touch-action:manipulation}#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;background:linear-gradient(155deg,#101425,#1a2944);pointer-events:auto;padding:24px}h1{font-size:clamp(36px,11vw,62px);margin:0;letter-spacing:-3px}#menu p{max-width:390px;text-align:center;line-height:1.5;color:#aabbd0;margin:0 0 14px}.choice{width:min(100%,390px);text-align:left;padding:17px 20px;border:1px solid #45617a;background:#20324d;border-radius:16px;color:#fff;font-weight:800;font-size:18px}.choice small{display:block;color:#b2c4d7;font-size:13px;font-weight:400;margin-top:5px}#hud{display:none;position:absolute;top:max(20px,env(safe-area-inset-top));left:18px;right:18px;align-items:center;justify-content:space-between;gap:10px}.pill{background:#0c1629c9;border:1px solid #ffffff30;border-radius:13px;padding:10px 13px;font-size:14px;font-weight:700}#exit{pointer-events:auto;background:#ffffff1a;color:#fff;border:1px solid #ffffff55;border-radius:13px;padding:10px 13px}#overlay{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:#091323a8;gap:14px;text-align:center;pointer-events:auto;padding:25px}#overlay h2{font-size:38px;margin:0}#overlay p{margin:0;color:#d0dceb;max-width:330px;line-height:1.5}.primary{background:#5cf1c5;color:#0d2430;border:0;border-radius:14px;padding:15px 25px;font-weight:900;font-size:17px}.secondary{background:#ffffff22;color:white;border:1px solid #ffffff55;border-radius:14px;padding:12px 20px}#hint{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));width:100%;text-align:center;color:#d4e4f0;font-size:14px;padding:0 25px;pointer-events:none}#credit{color:#8195ad;font-size:12px;margin-top:5px}</style></head><body><canvas id="game"></canvas><div id="ui"><section id="menu"><h1>ONE MORE<span style="color:#5cf1c5">.</span></h1><p>Drei eigenständige Arcade-Prototypen. Ein Finger. Ein Rekord. Welcher macht Lust auf den nächsten Versuch?</p><button class="choice" data-game="last">⏱ LAST SECOND<small>Tippe zum richtigen Zeitpunkt: Nur du bewegst dich während der Zeitlupe.</small></button><button class="choice" data-game="drop">◉ PERFECT DROP<small>Ein Tipp bremst deinen Fall. Lande mittig auf der bewegten Plattform.</small></button><button class="choice" data-game="gap">◌ THE GAP<small>Halte und ziehe: Verschiebe die Öffnung, bevor der Ball die Wand erreicht.</small></button><div id="credit">Offline spielbar · Keine Anmeldung · Keine Werbung</div></section><div id="hud"><button id="exit">← Spiele</button><span class="pill" id="score">0</span><span class="pill" id="best">BEST 0</span></div><div id="overlay"><h2 id="overTitle">Bereit?</h2><p id="overText"></p><button class="primary" id="again">SPIELEN</button><button class="secondary" id="back">Anderes Spiel</button></div><div id="hint"></div></div><script>
(()=>{'use strict';const c=document.querySelector('#game'),x=c.getContext('2d');let W=0,H=0,dpr=1,mode='',phase='menu',t=0,score=0,best=0,state={},pointer=false,lastTime=0;const $=s=>document.querySelector(s),rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function save(){try{localStorage.setItem('onemore_'+mode,Math.max(score,best))}catch(e){}}function read(){try{return +(localStorage.getItem('onemore_'+mode)||0)}catch(e){return 0}}function showMenu(){mode='';phase='menu';$('#menu').style.display='flex';$('#hud').style.display='none';$('#overlay').style.display='none';$('#hint').textContent=''}function choose(m){mode=m;best=read();$('#menu').style.display='none';$('#hud').style.display='flex';reset();phase='ready';$('#overlay').style.display='flex';$('#overTitle').textContent=m==='last'?'LAST SECOND':m==='drop'?'PERFECT DROP':'THE GAP';$('#overText').textContent=m==='last'?'Tippe: Die Hindernisse frieren kurz ein, dein Ball fliegt weiter. Triff die Lücken.':m==='drop'?'Tippe während des Falls, um einmal kräftig abzubremsen. Lande auf der Plattform.':'Ziehe die Öffnung mit dem Finger zum ankommenden Ball. Lass keinen Aufprall zu.';$('#again').textContent='STARTEN';$('#hint').textContent=''}function reset(){score=0;t=0;pointer=false;$('#score').textContent='0';$('#best').textContent='BEST '+best;const mid=W/2;state=mode==='last'?{ball:{x:W*.24,y:H*.5,r:13},walls:[],timer:0,freeze:0,energy:1,spawn:0,vy:0}:mode==='drop'?{ball:{x:mid,y:H*.14,r:17,vy:0},platform:{x:mid,y:H*.76,w:Math.min(W*.42,175),dir:1,speed:105},brake:1,landed:0,wait:0}: {ball:{x:mid,y:H*.68,r:12},wallY:H*.18,gapX:mid,gapW:Math.min(W*.31,130),speed:155,ballPhase:0,wallNum:0}}function start(){reset();phase='play';$('#overlay').style.display='none';$('#hint').textContent=mode==='last'?'TIPPE, um Hindernisse kurz einzufrieren':mode==='drop'?'EIN TIPP = EIN BREMSIMPULS':'HALTEN & ZIEHEN = LÜCKE BEWEGEN'}function lose(){if(phase!=='play')return;phase='dead';if(score>best){best=score;save()}$('#best').textContent='BEST '+best;$('#overTitle').textContent=score>0?'NOCH EINMAL?':'KNAPP DANEBEN!';$('#overText').textContent=`${score} Punkte · Rekord ${best}. ${mode==='last'?'Setze die Zeitlupe etwas später ein.':mode==='drop'?'Bremse erst, wenn du die Plattform einschätzen kannst.':'Bewege die Lücke früher zum Ball.'}`;$('#again').textContent='SOFORT NOCHMAL';$('#overlay').style.display='flex';$('#hint').textContent=''}function point(){score++;$('#score').textContent=score; if(score>best)$('#best').textContent='BEST '+score}function input(px){if(phase!=='play')return;if(mode==='last'){if(state.energy>=.45&&state.freeze<=0){state.freeze=.42;state.energy-=.45;state.vy=-105}}else if(mode==='drop'){if(state.brake>0){state.ball.vy=-95;state.brake=0}}else state.gapX=clamp(px,state.gapW/2+12,W-state.gapW/2-12)}function eventPos(e){return e.clientX}c.addEventListener('pointerdown',e=>{if(phase==='play'){pointer=true;c.setPointerCapture(e.pointerId);input(eventPos(e))}});c.addEventListener('pointermove',e=>{if(pointer&&phase==='play'&&mode==='gap')input(eventPos(e))});c.addEventListener('pointerup',()=>pointer=false);c.addEventListener('pointercancel',()=>pointer=false);document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>choose(b.dataset.game));$('#again').onclick=start;$('#back').onclick=showMenu;$('#exit').onclick=showMenu;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(phase==='play')input(W/2);else if(phase==='ready'||phase==='dead')start()}if(e.code==='Escape')showMenu();if(mode==='gap'&&phase==='play'){if(e.code==='ArrowLeft')state.gapX-=25;if(e.code==='ArrowRight')state.gapX+=25}});
function bg(){x.fillStyle='#101425';x.fillRect(0,0,W,H);x.strokeStyle='#ffffff0a';x.lineWidth=1;for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<H;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}}function circle(cx,cy,r,color){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fillStyle=color;x.fill()}function roundRect(rx,ry,rw,rh,rr,col){x.fillStyle=col;x.beginPath();x.roundRect(rx,ry,rw,rh,rr);x.fill()}function drawLast(dt){const s=state,b=s.ball;const speed=190+score*5;if(phase==='play'){t+=dt;s.energy=Math.min(1,s.energy+dt*.23);s.freeze=Math.max(0,s.freeze-dt);s.spawn+=dt;if(s.spawn>1.52){s.spawn=0;let gap=rand(H*.29,H*.67);s.walls.push({x:W+45,gap,passed:false,width:40})}b.y+=s.vy*dt;s.vy+=(s.freeze>0?10:110)*dt;b.y=clamp(b.y,b.r,H-b.r);if(s.freeze<=0)s.vy+=(H*.51-b.y)*dt*.38;for(const w of s.walls){w.x-=speed*dt*(s.freeze>0?.07:1);let gapH=Math.max(110,H*.27-score*2);if(!w.passed&&w.x+w.width<b.x){w.passed=true;point()}if(b.x+b.r>w.x&&b.x-b.r<w.x+w.width&&(b.y-b.r<w.gap-gapH/2||b.y+b.r>w.gap+gapH/2))lose()}s.walls=s.walls.filter(w=>w.x>-70)}for(const w of s.walls){const gh=Math.max(110,H*.27-score*2);roundRect(w.x,0,w.width,w.gap-gh/2,7,'#fc688a');roundRect(w.x,w.gap+gh/2,w.width,H-w.gap-gh/2,7,'#fc688a');roundRect(w.x-5,w.gap-gh/2-5,w.width+10,7,3,'#ff9ab0');roundRect(w.x-5,w.gap+gh/2-2,w.width+10,7,3,'#ff9ab0')}circle(b.x,b.y,b.r,'#5cf1c5');circle(b.x-4,b.y-4,4,'#eafff9');roundRect(20,H-40,(W-40)*s.energy,8,4,'#5cf1c5');x.fillStyle='#b9d4e7';x.font='12px system-ui';x.fillText('ZEITLUPE',20,H-49);if(s.freeze>0){x.fillStyle='#5cf1c515';x.fillRect(0,0,W,H)}}function drawDrop(dt){const s=state,b=s.ball,p=s.platform;if(phase==='play'){t+=dt;p.x+=p.dir*p.speed*dt;if(p.x-p.w/2<12){p.x=p.w/2+12;p.dir=1}if(p.x+p.w/2>W-12){p.x=W-p.w/2-12;p.dir=-1}if(s.wait>0){s.wait-=dt;if(s.wait<=0){b.x=clamp(p.x+rand(-65,65),35,W-35);b.y=H*.13;b.vy=0;s.brake=1;p.w=Math.max(66,p.w-4);p.speed+=9}}else{b.vy+=550*dt;b.y+=b.vy*dt;if(b.vy>0&&b.y+b.r>=p.y&&b.y-b.r<p.y+17){if(Math.abs(b.x-p.x)<p.w/2+b.r*.2){let quality=1-Math.abs(b.x-p.x)/(p.w/2);if(quality>.82){point();point()}else point();s.wait=.52;b.y=p.y-b.r;b.vy=0}else lose()}if(b.y>H+30)lose()}}roundRect(p.x-p.w/2,p.y,p.w,17,8,'#5cf1c5');roundRect(p.x-3,p.y-5,6,27,3,'#faffff');circle(b.x,b.y,b.r,'#ffcd72');circle(b.x-5,b.y-5,4,'#fff4d7');x.font='13px system-ui';x.fillStyle='#b9d4e7';x.fillText(s.brake?'BREMSIMPULS BEREIT':'BREMSIMPULS VERBRAUCHT',20,H-30)}function drawGap(dt){const s=state,b=s.ball;if(phase==='play'){t+=dt;s.wallY+=s.speed*dt;s.ballPhase+=dt*(2+score*.1);b.x=W/2+Math.sin(s.ballPhase)*Math.min(W*.27,110);if(s.wallY>=b.y-b.r&&s.wallY-s.speed*dt<b.y-b.r){if(Math.abs(b.x-s.gapX)>s.gapW/2-b.r*.65)lose();else{point();s.wallY=-50;s.speed=Math.min(360,s.speed+8);s.gapW=Math.max(57,s.gapW-1.5);s.ballPhase+=.8}}}roundRect(0,s.wallY,Math.max(0,s.gapX-s.gapW/2),20,4,'#fc688a');roundRect(s.gapX+s.gapW/2,s.wallY,Math.max(0,W-s.gapX-s.gapW/2),20,4,'#fc688a');circle(b.x,b.y,b.r,'#5cf1c5');circle(b.x-3,b.y-3,3,'#fff');x.strokeStyle='#5cf1c566';x.lineWidth=2;x.beginPath();x.arc(W/2,b.y,Math.min(W*.27,110),0,Math.PI*2);x.stroke();x.fillStyle='#b9d4e7';x.font='13px system-ui';x.fillText('VERSCHIEBE DIE LÜCKE',20,H-30)}function loop(now){const dt=Math.min((now-lastTime)/1000||0,.035);lastTime=now;bg();if(mode==='last')drawLast(dt);else if(mode==='drop')drawDrop(dt);else if(mode==='gap')drawGap(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);})();</script></body></html>
